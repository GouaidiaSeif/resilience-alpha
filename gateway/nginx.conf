# Passerelle : routage /api/* vers les services. Non publiée : on y entre par le WAF (waf/, ModSecurity + OWASP CRS),
# ou depuis la pile (sonde, front).
#
# Résolution DNS dynamique (resolver + variable) : la passerelle démarre même si un service est arrêté et
# retrouve un service redémarré par le moteur de remédiation, sans recharger nginx.
#
# Chaque requête est soumise au détecteur ML (auth_request) : un client qu'il a bloqué reçoit 403.

log_format json_combined escape=json
  '{"time":"$time_iso8601","source":"gateway","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time",'
  '"bytes_sent":$body_bytes_sent,"user_agent":"$http_user_agent","request_id":"$request_id"}';

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    # Conteneur arrêté (détecteur, service en reprise) : le DNS de Docker cherche alors un serveur externe, injoignable
    # depuis le réseau interne. Sans limite, chaque requête attendrait plusieurs secondes avant l'ouverture par défaut ou le 502.
    resolver_timeout 500ms;

    # IP réelle du client : transmise par le WAF (X-Forwarded-For, qu'il remplace toujours). Seule l'adresse
    # fixe du WAF est crue ; le front et la sonde, qui appellent directement, gardent leur propre adresse.
    set_real_ip_from 10.250.0.5;
    real_ip_header X-Forwarded-For;

    client_max_body_size 64k;
    proxy_connect_timeout 2s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;      # l'identifiant fourni par le client est écrasé

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ───── Détecteur ML : liste de blocage consultée avant chaque requête /api ─────
    # 204 = laisser passer, 403 = client bloqué. Ouverture par défaut : si le détecteur est absent, arrêté ou lent
    # (> 300 ms), la requête passe — une panne du détecteur ne coupe jamais la plateforme.
    location = /_detector_check {
        internal;
        set $det http://detector:8000/internal/check;
        proxy_pass $det;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Client-Key "$remote_addr|$http_user_agent";
        proxy_set_header X-Check-Origin gateway;
        proxy_connect_timeout 300ms;
        proxy_read_timeout 300ms;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @detector_unavailable;
    }
    # Contrôle demandé par le WAF pour CHAQUE requête externe (pages du front comprises) : bans et blocages ML.
    # Réservé au WAF (adresse réelle de la connexion, avant realip) ; jamais journalisé (sinon le modèle ML
    # compterait ces contrôles comme du trafic). Réponse du détecteur transmise telle quelle (204 / 403).
    location = /_waf/check {
        access_log off;
        if ($realip_remote_addr != "10.250.0.5") {
            return 404;
        }
        set $det http://detector:8000/internal/check;
        proxy_pass $det;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Client-Key "$remote_addr|$http_user_agent";
        proxy_set_header X-Check-Origin waf;
        proxy_connect_timeout 300ms;
        proxy_read_timeout 300ms;
    }
    location @detector_unavailable {
        return 204;
    }
    # Motif renvoyé par le détecteur (en-tête X-Block-Reason) : IP bannie ou client bloqué par le modèle.
    auth_request_set $block_reason $upstream_http_x_block_reason;
    location @blocked {
        default_type application/json;
        if ($block_reason = "banned") {
            return 403 '{"detail":"Adresse IP bannie : contactez l’administrateur de la plateforme"}';
        }
        return 403 '{"detail":"Accès temporairement bloqué : trafic anormal détecté"}';
    }

    # Endpoints internes (service à service) : jamais exposés.
    # Ici pas de `return 404` : `return` s'exécute AVANT `auth_request` (phase rewrite) et court-circuiterait le
    # contrôle ; `try_files` vers @notfound s'exécute après (phase précontenu), donc un client bloqué reçoit 403.
    location ^~ /internal/ {
        auth_request /_detector_check;
        error_page 403 = @blocked;
        try_files /__aucun_fichier @notfound;
    }
    location @notfound {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }

    location = /api/auth/login {
        auth_request /_detector_check;
        error_page 403 = @blocked;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        set $up http://auth:8000;
        proxy_pass $up;
    }
    location /api/auth          { auth_request /_detector_check; error_page 403 = @blocked; set $up http://auth:8000;          proxy_pass $up; }
    location /api/accounts      { auth_request /_detector_check; error_page 403 = @blocked; set $up http://accounts:8000;      proxy_pass $up; }
    location /api/payments      { auth_request /_detector_check; error_page 403 = @blocked; set $up http://payments:8000;      proxy_pass $up; }
    location /api/notifications { auth_request /_detector_check; error_page 403 = @blocked; set $up http://notifications:8000; proxy_pass $up; }
    location /api/audit         { auth_request /_detector_check; error_page 403 = @blocked; set $up http://audit:8000;         proxy_pass $up; }   # réservé au rôle admin (vérifié par le service)
    location /api/security      { auth_request /_detector_check; error_page 403 = @blocked; set $up http://detector:8000;      proxy_pass $up; }   # liste des bans (rôle admin, vérifié par le détecteur)

    # Le moteur de remédiation, la sonde, /metrics, /ready et /docs ne sont volontairement pas routés.
    # Contrôlé aussi : un client bloqué pour balayage reçoit 403 au lieu de 404.
    location / {
        auth_request /_detector_check;
        error_page 403 = @blocked;
        try_files /__aucun_fichier @notfound;
    }
}
