apiVersion: 1
# Dashboards versionnés : chaque fichier JSON de ./json est chargé au démarrage de Grafana.
# Modifier un dashboard dans l'interface ne change PAS ces fichiers : exporter le JSON et le remplacer ici.
providers:
  - name: resilience-alpha
    folder: Resilience Alpha
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
