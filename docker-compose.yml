name: resilience-alpha

# Réseaux :
#   edge         Grafana et Vault (publiés en local uniquement) ; Grafana y joint Discord pour les alertes
#   web          WAF (seul point d'entrée publié) <-> passerelle et front ; adresses fixes du WAF et du front
#   backend      interne (sans accès Internet) : services, Postgres, observabilité, détecteur ML
#   remediation  interne : moteur de remédiation <-> proxy Docker restreint, rien d'autre
#   obs          interne : Promtail <-> proxy Docker en lecture seule, rien d'autre
networks:
  edge: {}
  web:
    ipam:
      config: [{subnet: 10.250.0.0/24}]
  backend:
    internal: true
  remediation:
    internal: true
  obs:
    internal: true

volumes:
  pgdata: {}
  vault-data: {}      # stockage chiffré de Vault (scellé au repos)
  detector-data: {}   # liste des bans du détecteur (survit aux redémarrages)

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

# Identifiant PostgreSQL temporaire (moteur database de Vault) : utilisateur et mot de passe insérés au démarrage.
x-db-url: &db-url postgresql://{username}:{password}@postgres:5432/resilience

x-after-vault: &after-vault
  postgres: {condition: service_healthy}
  vault-keeper: {condition: service_healthy}

x-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 10s

# Aucun secret dans l'environnement : chaque service lit les siens dans Vault au démarrage (resilience_common/vault.py),
# avec son identité AppRole (/run/vault, écrite par vault-keeper) et une politique limitée à ses propres secrets.
x-app-env: &app-env
  VAULT_ADDR: http://vault:8200
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUDIT_URL: http://audit:8000
  NOTIFICATIONS_URL: http://notifications:8000

services:
  # ───────────────────────── secrets (HashiCorp Vault) ─────────────────────────
  # Mode serveur, stockage persistant (volume vault-data), scellé à chaque démarrage. Interface web et API
  # d'administration sur http://127.0.0.1:8200 (jeton : .vault/init.json). Voir docs/03-secrets-vault.md.
  vault:
    image: hashicorp/vault:2.1.2
    container_name: rsl-vault
    restart: unless-stopped
    command: ["server"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SKIP_SETCAP: "true"     # pas de mlock sous Docker Desktop (disable_mlock dans vault.hcl)
      SKIP_CHOWN: "true"
    volumes:
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    ports: ["127.0.0.1:8200:8200"]
    networks: [edge, backend]
    healthcheck:
      # Répond 200 même scellé ou non initialisé : on vérifie que le processus vit ; le descellement est l'affaire du gardien.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200&standbyok=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Initialise (première fois), descelle, configure Vault, crée les secrets absents (repris de l'ancien .env ou
  # générés), écrit l'identité AppRole de chaque service, puis redescelle Vault s'il redémarre. infra/vault/keeper.py.
  vault-keeper:
    image: python:3.12-slim
    container_name: rsl-vault-keeper
    restart: unless-stopped
    command: ["python", "-u", "/app/keeper.py"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]          # fichiers de secrets attribués au seul conteneur qui les lit (sous Linux)
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    environment:
      VAULT_ADDR: http://vault:8200
      KEYS_DIR: /vault-keys
      # Migration : secrets d'un ancien .env importés dans Vault au premier démarrage (puis inutiles dans .env).
      LEGACY_JWT_SECRET: ${JWT_SECRET:-}
      LEGACY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LEGACY_CANARY_PASSWORD: ${CANARY_PASSWORD:-}
      LEGACY_GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      LEGACY_DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LEGACY_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
    volumes:
      - ./infra/vault/keeper.py:/app/keeper.py:ro
      - ./.vault:/vault-keys      # clé de descellement, jeton racine, identités AppRole (PC Hôte, jamais dans Git)
    depends_on: {vault: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/tmp/ready') else 1)"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks: [backend]

  # ───────────────────────── données ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rsl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resilience
      POSTGRES_USER: pgadmin
      # Mot de passe du super-utilisateur, gardé dans Vault (secret/resilience/postgres) ; seul Vault s'en sert ensuite
      # (moteur database). Les services n'ont plus de mot de passe fixe : identifiants temporaires créés par Vault.
      POSTGRES_PASSWORD_FILE: /run/vault-rendered/admin_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./.vault/rendered/postgres:/run/vault-rendered:ro
    depends_on: {vault-keeper: {condition: service_healthy}}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d resilience"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ───────────────────────── WAF (seul point d'entrée publié) ─────────────────────────
  # ModSecurity + OWASP CRS, TLS, IP réelle du client, limite par IP. Relaie /api/* à la passerelle et le reste
  # au front. Ports : 8080 (HTTP) et 8443 (HTTPS) ; 18080/18443 en local pour le relais d'IP réelle
  # (scripts/edge_relay.py, Docker Desktop). Voir docs/02, section 3.14.
  waf:
    image: owasp/modsecurity-crs:4.25.2-nginx-alpine-202610051210-lts
    container_name: rsl-waf
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    restart: unless-stopped
    environment:
      MODSEC_RULE_ENGINE: ${WAF_RULE_ENGINE:-On}      # On = bloque ; DetectionOnly = journalise seulement
      BLOCKING_PARANOIA: ${WAF_PARANOIA:-1}
      ALLOWED_METHODS: GET HEAD POST OPTIONS DELETE     # CRS : DELETE refusé par défaut (utilisé par la liste des bans)
      ACCESSLOG: /dev/null                           # remplacé par le journal JSON (waf/includes/waf_routes)
      ERRORLOG: /dev/stderr
    ports:
      - "${WAF_HTTP_BIND:-0.0.0.0:8080}:8080"
      - "${WAF_HTTPS_BIND:-0.0.0.0:8443}:8443"
      - "127.0.0.1:18080:8081"                        # relais (PROXY protocol), joignable par l'hôte seulement
      - "127.0.0.1:18443:8444"
    volumes:
      - ./waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/includes/waf_routes.conf.template:/etc/nginx/templates/includes/waf_routes.conf.template:ro
      - ./waf/includes/waf_tls.conf.template:/etc/nginx/templates/includes/waf_tls.conf.template:ro
      - ./waf/includes/waf_proxy.conf.template:/etc/nginx/templates/includes/waf_proxy.conf.template:ro
      - ./waf/exclusions-before-crs.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./waf/custom-rules.conf:/etc/modsecurity.d/owasp-crs/rules/custom-rules.conf:ro
    depends_on: [gateway, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/waf-health || curl -fs http://127.0.0.1:8080/waf-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      web:
        ipv4_address: 10.250.0.5

  # ───────────────────────── passerelle (derrière le WAF) ─────────────────────────
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: rsl-gateway
    <<: *hardening
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # contrôle auth_request vers le détecteur ML
    networks: [web, backend]          # plus de port publié : on n'y entre que par le WAF (ou depuis la pile)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ───────────────────────── services métier ─────────────────────────
  # restart: "no" VOLONTAIRE sur les services métier : si Docker les relançait seul, la « reprise » ne prouverait
  # rien. C'est le moteur de remédiation qui doit les rétablir (et le démontrer par une transaction réussie).
  auth:
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: auth}}
    image: rsl/auth:dev
    container_name: rsl-auth
    <<: *hardening
    restart: "no"
    environment:
      <<: *app-env
      VAULT_ROLE: auth
      VAULT_DB_ROLE: auth
      DATABASE_URL_TEMPLATE: *db-url
    depends_on: *after-vault
    volumes: ["./.vault/approle/auth:/run/vault:ro"]   # identité AppRole du service
    healthcheck: *app-healthcheck
    networks: [backend]

  accounts:
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: accounts}}
    image: rsl/accounts:dev
    container_name: rsl-accounts
    <<: *hardening
    restart: "no"
    environment:
      <<: *app-env
      VAULT_ROLE: accounts
      VAULT_DB_ROLE: accounts
      DATABASE_URL_TEMPLATE: *db-url
    depends_on: *after-vault
    volumes: ["./.vault/approle/accounts:/run/vault:ro"]   # identité AppRole du service
    healthcheck: *app-healthcheck
    networks: [backend]

  payments:
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: payments}}
    image: rsl/payments:dev
    container_name: rsl-payments
    <<: *hardening
    restart: "no"
    environment:
      <<: *app-env
      VAULT_ROLE: payments
      VAULT_DB_ROLE: payments
      DATABASE_URL_TEMPLATE: *db-url
      ACCOUNTS_URL: http://accounts:8000
      PAYMENT_MAX_AMOUNT: ${PAYMENT_MAX_AMOUNT:-5000}
    depends_on: *after-vault
    volumes: ["./.vault/approle/payments:/run/vault:ro"]   # identité AppRole du service
    healthcheck: *app-healthcheck
    networks: [backend]

  notifications:
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: notifications}}
    image: rsl/notifications:dev
    container_name: rsl-notifications
    <<: *hardening
    restart: "no"
    environment:
      <<: *app-env
      VAULT_ROLE: notifications
      VAULT_DB_ROLE: notifications
      DATABASE_URL_TEMPLATE: *db-url
    depends_on: *after-vault
    volumes: ["./.vault/approle/notifications:/run/vault:ro"]   # identité AppRole du service
    healthcheck: *app-healthcheck
    networks: [backend]

  # ───────────────────────── plan de contrôle (relancé par Docker, hors liste blanche de remédiation) ─────────────────────────
  audit:
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: audit}}
    image: rsl/audit:dev
    container_name: rsl-audit
    <<: *hardening
    restart: unless-stopped
    environment:
      <<: *app-env
      VAULT_ROLE: audit
      VAULT_DB_ROLE: audit
      DATABASE_URL_TEMPLATE: *db-url
    depends_on: *after-vault
    volumes: ["./.vault/approle/audit:/run/vault:ro"]   # identité AppRole du service
    healthcheck: *app-healthcheck
    networks: [backend]

  remediation:
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: remediation}}
    image: rsl/remediation:dev
    container_name: rsl-remediation
    <<: *hardening
    restart: unless-stopped
    environment:
      <<: *app-env
      VAULT_ROLE: remediation
      DOCKER_API_URL: http://docker-proxy-remediation:2375
      CANARY_URL: http://canary:8000
      ACCOUNTS_URL: http://accounts:8000
    depends_on: {docker-proxy-remediation: {condition: service_started}, vault-keeper: {condition: service_healthy}}
    volumes: ["./.vault/approle/remediation:/run/vault:ro"]   # identité AppRole du service
    healthcheck: *app-healthcheck
    networks: [backend, remediation]    # PAS sur edge : jamais joignable depuis l'extérieur

  canary:
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: canary}}
    image: rsl/canary:dev
    container_name: rsl-canary
    <<: *hardening
    restart: unless-stopped
    environment:
      <<: *app-env
      GATEWAY_URL: http://gateway:8080
      ACCOUNTS_URL: http://accounts:8000
      REMEDIATION_URL: http://remediation:8000
      VAULT_ROLE: canary
      CANARY_ALERTS_ENABLED: ${CANARY_ALERTS_ENABLED:-true}
    depends_on: {gateway: {condition: service_started}, vault-keeper: {condition: service_healthy}}
    volumes: ["./.vault/approle/canary:/run/vault:ro"]   # identité AppRole du service
    healthcheck: *app-healthcheck
    networks: [backend]

  # ───────────────────────── détection ML (lancée avec la pile) ─────────────────────────
  # Note le trafic de la passerelle toutes les 5 s (Loki) et bloque les clients anormaux (passerelle, 403).
  # Charge le modèle publié ml/model/model.joblib (versionné) ; sans ce fichier il tourne à vide et ne bloque rien.
  # Ouverture par défaut : détecteur arrêté = la passerelle laisse passer (docker compose stop detector).
  detector:
    build: {context: ., dockerfile: ml/Dockerfile}
    image: rsl/detector:dev
    container_name: rsl-detector
    <<: *hardening
    restart: unless-stopped
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE: detector
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUDIT_URL: http://audit:8000
      LOKI_URL: http://loki:3100
      REMEDIATION_URL: http://remediation:8000
      MODEL_PATH: /app/model/model.joblib
      BLOCK_TTL_SECONDS: ${DETECTOR_BLOCK_TTL_SECONDS:-600}
      ALLOW_HOSTS: canary,10.250.0.10     # la sonde et le conteneur du front ne sont jamais bloqués
      # Liste des bans : jamais d'adresse partagée (hôte Docker, WAF, front) ; bans automatiques WAF et ML.
      NEVER_BAN: 127.0.0.0/8,::1/128,10.250.0.0/24
      WAF_BAN_THRESHOLD: ${WAF_BAN_THRESHOLD:-5}           # requêtes bloquées par le WAF en 2 min avant ban
      WAF_BAN_TTL_SECONDS: ${WAF_BAN_TTL_SECONDS:-3600}
    volumes:
      - ./ml/model:/app/model:ro
      - detector-data:/data
      - ./.vault/approle/detector:/run/vault:ro
    depends_on: {loki: {condition: service_started}, vault-keeper: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [backend]

  # ───────────────────────── front (BFF Next.js) ─────────────────────────
  # Seul le serveur du front parle à la passerelle ; le navigateur ne voit que le front (jeton en cookie httpOnly).
  frontend:
    build: {context: ./frontend}
    image: rsl/frontend:dev
    container_name: rsl-frontend
    <<: *hardening
    tmpfs: ["/tmp", "/app/.next/cache"]
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:8080
    depends_on: [gateway]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/bff/ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      web:
        ipv4_address: 10.250.0.10

  # ───────────────────────── proxys Docker restreints ─────────────────────────
  # Aucun service n'a le socket Docker. Ces deux proxys filtrent l'API par catégorie.
  docker-proxy-remediation:
    image: tecnativa/docker-socket-proxy:latest   # à épingler sur une version précise avant rendu
    container_name: rsl-docker-proxy-remediation
    restart: unless-stopped
    # Règles HAProxy du proxy, dans l'ordre : tout non-GET est refusé si POST=0 (même avec ALLOW_RESTARTS),
    # puis chaque catégorie est autorisée, puis tout le reste est refusé. POST=1 est donc nécessaire, et
    # CONTAINERS=0 évite d'ouvrir POST /containers/* (création, suppression) : seuls stop|restart|kill passent.
    environment:
      POST: 1                # nécessaire pour que ALLOW_RESTARTS s'applique
      ALLOW_RESTARTS: 1      # POST /containers/{id}/stop|restart|kill uniquement
      CONTAINERS: 0          # ni inspection ni création/suppression (le moteur n'en a pas besoin)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [remediation]

  docker-proxy-ro:
    image: tecnativa/docker-socket-proxy:latest
    container_name: rsl-docker-proxy-ro
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]

  # ───────────────────────── observabilité ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rsl-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [backend]

  loki:
    image: grafana/loki:3.2.1
    container_name: rsl-loki
    restart: unless-stopped
    networks: [backend]

  promtail:
    image: grafana/promtail:3.2.1
    container_name: rsl-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    depends_on: [docker-proxy-ro, loki]
    networks: [backend, obs]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rsl-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/vault-rendered/admin_password    # secret/resilience/grafana (Vault)
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000          # liens « voir dans Grafana » des alertes Discord
      TZ: ${TZ:-Europe/Paris}
    ports: ["127.0.0.1:3000:3000"]     # visible uniquement depuis le PC Hôte (jury)
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mot de passe admin et webhook Discord, rendus depuis Vault par vault-keeper (Grafana ne lit pas Vault).
      - ./.vault/rendered/grafana:/run/vault-rendered:ro
    depends_on: {prometheus: {condition: service_started}, loki: {condition: service_started}, vault-keeper: {condition: service_healthy}}
    networks: [edge, backend]
