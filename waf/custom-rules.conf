# Règles maison, en complément de l'OWASP Core Rule Set (CRS 4, actif par défaut dans l'image).
# Le CRS couvre la détection générique (injection SQL, XSS, traversée de chemin, etc.) ; ces règles ciblent
# notre contexte. Chargé APRÈS les règles du CRS (même dossier, ordre alphabétique).
# Plage d'identifiants 9000000-9000999 : réservée aux règles locales par convention CRS.

# --- Règle 1 : outils de scan ou d'exploitation reconnus à leur User-Agent (sqlmap sans --random-agent,
# nikto, moteur de scripts nmap…). Avec un agent aléatoire, les règles génériques du CRS prennent le relais.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap scripting engine|acunetix|nessus|masscan|wpscan|dirbuster|gobuster)" \
    "id:9000001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Outil de scan ou d exploitation détecté dans le User-Agent',\
    tag:'resilience-alpha/recon',\
    severity:'CRITICAL'"

# --- Règle 2 : seuil d'anomalie abaissé sur /api/payments, la route la plus sensible (défaut CRS : 5).
# Une seule détection « critique » (score 5) bloque déjà ailleurs ; ici, une détection « erreur » (score 4)
# ou deux « avertissements » suffisent.
SecRule REQUEST_URI "@beginsWith /api/payments" \
    "id:9000002,\
    phase:1,\
    pass,\
    nolog,\
    setvar:tx.inbound_anomaly_score_threshold=3"

# Note : pas de règle « tout 403 = blocage WAF ». Les 403 viennent aussi du détecteur ML, de la liste des bans
# et des contrôles d'accès des services ; les blocages du WAF sont tracés par ModSecurity lui-même (journal
# d'audit JSON sur la sortie standard, Loki {service="waf"}), avec la règle déclenchée.

# --- Exclusion : 920350 « Host header is a numeric IP address ». En laboratoire, tout le monde (attaquant compris)
# joint la plateforme par son adresse IP (https://192.168.137.1:8443) : la règle ne distingue rien et ajouterait
# 3 points d'anomalie à chaque requête légitime.
SecRuleRemoveById 920350

# Exclusions propres aux pages du front (920420, 922130) : waf/exclusions-before-crs.conf (chargé avant le CRS).
