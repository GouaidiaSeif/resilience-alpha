# Exclusions chargées AVANT l'OWASP CRS (monté en REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf) : nécessaire pour
# les règles de phase 1 du CRS, qui s'exécutent avant les règles maison (waf/custom-rules.conf).
# Périmètre : les PAGES du front (Next.js) uniquement. L'API (/api/*) garde la configuration CRS stricte.
# Faux positifs constatés en faisant passer le parcours complet de l'interface par le WAF (2026-10-20).

# 920420 « type de contenu non autorisé » : les Server Actions appelées en JavaScript envoient text/plain.
# Liste par défaut du CRS 4 + text/plain.
SecRule REQUEST_URI "!@beginsWith /api/" \
    "id:9000010,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain|'"

# 922130 « caractères hors plage dans un en-tête multipart » : les formulaires Next.js nomment leurs champs
# « 1_$ACTION_ID_… » ; le « $ » déclenche la règle sur chaque formulaire légitime.
SecRule REQUEST_URI "!@beginsWith /api/" \
    "id:9000011,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=922130"

# Paramètre « client » de DELETE /api/security/blocks (route réservée au rôle admin) : c'est la clé « IP|agent »
# d'un client bloqué, donc souvent l'agent d'un outil (python-requests, curl…) que les règles d'injection de
# commande (attack-rce, ex. 932235) prennent pour une attaque. Seul ce paramètre de cette route est exclu de ces
# règles ; il ne sert que de clé de recherche dans le détecteur.
SecRule REQUEST_URI "@beginsWith /api/security/blocks" \
    "id:9000012,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:client"
