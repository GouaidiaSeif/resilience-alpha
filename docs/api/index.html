<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RESILIENCE-ALPHA · Swagger</title>
  <!-- Visionneuse Swagger hors ligne des spécifications versionnées (générées par scripts/export_openapi.py).
       Lancer : python -m http.server 8088 --directory docs/api   puis ouvrir http://localhost:8088 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar .download-url-wrapper .select-label { color: #fff; }
  </style>
</head>
<body>
  <div id="swagger"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      dom_id: "#swagger",
      urls: [
        { url: "auth.openapi.json", name: "auth — inscription, connexion, JWT" },
        { url: "accounts.openapi.json", name: "accounts — comptes et ledger" },
        { url: "payments.openapi.json", name: "payments — paiements idempotents" },
        { url: "notifications.openapi.json", name: "notifications — notifications simulées" },
        { url: "audit.openapi.json", name: "audit — piste chaînée par hachage" },
        { url: "remediation.openapi.json", name: "remediation — moteur de reprise (interne)" },
        { url: "canary.openapi.json", name: "canary — sonde synthétique (interne)" },
      ],
      "urls.primaryName": "payments — paiements idempotents",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout",
      deepLinking: true,
      tryItOutEnabled: false,
      supportedSubmitMethods: [],
    });
  </script>
</body>
</html>
